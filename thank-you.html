<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <meta name="offer" content="business inquiry">
    <title>Message Sent - Ryan Sterling</title>
    <script src="https://d15dfsr886zcp9.cloudfront.net/thankYou_script.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'Soehne';
            src: url('./fonts/Test Söhne/test-soehne-extrafett.woff2') format('woff2');
            font-weight: 800;
            font-style: normal;
        }

        .font-soehne {
            font-family: 'Soehne', sans-serif;
        }

        .headline-gradient {
            background: linear-gradient(78deg, #1398F8 -21.21%, #FF5024 90.36%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#1a1a1a',
                        'brand-orange': '#e86c3a',
                        'brand-blue': '#5b8a9a',
                        'brand-mauve': '#a87f8f',
                    }
                }
            }
        }
    </script>
</head>
<body style="background: #111;" class="min-h-screen flex items-center justify-center">
    <main class="max-w-2xl mx-auto px-8 py-24 text-center">
        <!-- Success Icon -->
        <div class="mb-8">
            <div class="w-20 h-20 mx-auto rounded-full flex items-center justify-center" style="background: #FF5125;">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
        </div>

        <!-- Heading -->
        <h1 class="font-soehne text-4xl md:text-5xl headline-gradient mb-6">
            Message Sent!
        </h1>

        <!-- Confirmation Text -->
        <p class="text-gray-300 text-lg md:text-xl mb-4">
            Thanks for reaching out. I've received your message and will get back to you within 24-48 hours.
        </p>
        <p class="text-gray-500 mb-10">
            Keep an eye on your inbox!
        </p>

        <!-- Back Button -->
        <a
            href="/"
            class="inline-block text-white font-medium text-lg px-8 py-4 hover:opacity-90 transition-opacity"
            style="background: #FF5125; border-radius: 19px;"
        >
            Back to Home
        </a>
    </main>
</body>
</html>
