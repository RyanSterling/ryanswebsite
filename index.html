<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryan Sterling - Content Creation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'Soehne';
            src: url('./fonts/Test Söhne/test-soehne-extrafett.woff2') format('woff2');
            font-weight: 800;
            font-style: normal;
        }

        .font-soehne {
            font-family: 'Soehne', sans-serif;
        }

        .headline-gradient {
            background: linear-gradient(78deg, #1398F8 -21.21%, #FF5024 90.36%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#1a1a1a',
                        'brand-orange': '#e86c3a',
                        'brand-blue': '#5b8a9a',
                        'brand-mauve': '#a87f8f',
                    }
                }
            }
        }
    </script>
</head>
<body style="background: #111;" class="min-h-screen">
    <main class="max-w-6xl mx-auto px-8 py-24 md:py-32">
        <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-12">
            <!-- Portrait (shows first on mobile) -->
            <div class="flex-shrink-0 order-first md:order-last flex justify-center md:justify-end">
                <div class="w-48 h-48 md:w-56 md:h-56 lg:w-64 lg:h-64 rounded-full overflow-hidden bg-brand-orange">
                    <img
                        src="./assets/portrait.png"
                        alt="Ryan Sterling"
                        class="w-full h-full object-cover"
                    >
                </div>
            </div>

            <!-- Headline Section -->
            <div class="flex-1">
                <h1 class="font-soehne text-5xl md:text-6xl lg:text-7xl leading-tight tracking-tight headline-gradient">
                    Helping Businesses
                    <br>
                    Make More Money
                    <br>
                    With Content Creation
                </h1>
            </div>
        </div>

        <!-- Contact Form -->
        <section id="contact" class="mt-16 md:mt-20 max-w-2xl mx-auto">
            <h2 class="font-soehne text-3xl md:text-4xl text-white text-center mb-12">Let's Work Together</h2>

            <form name="contact" netlify class="space-y-6">
                <!-- Name -->
                <div>
                    <label for="name" class="block text-white text-sm mb-2">Name <span class="text-red-500">*</span></label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        placeholder="Your name"
                        class="w-full px-4 py-3 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500"
                        style="background: #1D1D1D;"
                    >
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-white text-sm mb-2">Email Address <span class="text-red-500">*</span></label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="you@example.com"
                        class="w-full px-4 py-3 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500"
                        style="background: #1D1D1D;"
                    >
                </div>

                <!-- Industry -->
                <div>
                    <label for="industry" class="block text-white text-sm mb-2">What industry are you in? <span class="text-red-500">*</span></label>
                    <input
                        type="text"
                        id="industry"
                        name="industry"
                        required
                        placeholder="e.g. Real Estate, Fitness, E-commerce"
                        class="w-full px-4 py-3 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500"
                        style="background: #1D1D1D;"
                    >
                </div>

                <!-- What do you need help with -->
                <div>
                    <label for="help" class="block text-white text-sm mb-2">What do you need help with? <span class="text-red-500">*</span></label>
                    <textarea
                        id="help"
                        name="help"
                        required
                        rows="4"
                        placeholder="Tell me about your content goals and challenges..."
                        class="w-full px-4 py-3 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500 resize-none"
                        style="background: #1D1D1D;"
                    ></textarea>
                </div>

                <!-- Social Media Links -->
                <div class="pt-4">
                    <p class="text-white text-sm mb-4">Your social media links</p>

                    <div class="space-y-4">
                        <!-- TikTok -->
                        <div class="flex items-center gap-3">
                            <div class="w-10 flex justify-center">
                                <svg class="w-6 h-6 text-gray-400" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                                </svg>
                            </div>
                            <input
                                type="url"
                                name="tiktok"
                                placeholder="https://tiktok.com/@yourusername"
                                class="flex-1 px-4 py-3 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500"
                                style="background: #1D1D1D;"
                            >
                        </div>

                        <!-- Instagram -->
                        <div class="flex items-center gap-3">
                            <div class="w-10 flex justify-center">
                                <svg class="w-6 h-6 text-gray-400" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                                </svg>
                            </div>
                            <input
                                type="url"
                                name="instagram"
                                placeholder="https://instagram.com/yourusername"
                                class="flex-1 px-4 py-3 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500"
                                style="background: #1D1D1D;"
                            >
                        </div>

                        <!-- YouTube -->
                        <div class="flex items-center gap-3">
                            <div class="w-10 flex justify-center">
                                <svg class="w-6 h-6 text-gray-400" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                                </svg>
                            </div>
                            <input
                                type="url"
                                name="youtube"
                                placeholder="https://youtube.com/@yourchannel"
                                class="flex-1 px-4 py-3 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500"
                                style="background: #1D1D1D;"
                            >
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-6">
                    <button
                        type="submit"
                        class="w-full text-white font-medium text-lg py-4 hover:opacity-90 transition-opacity"
                        style="background: #FF5125; border-radius: 19px;"
                    >
                        Send Message
                    </button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
