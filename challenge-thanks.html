<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <meta name="offer" content="10k challenge">
    <title>You're In! - The 10K Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'Soehne';
            src: url('./fonts/Test Söhne/test-soehne-extrafett.woff2') format('woff2');
            font-weight: 800;
            font-style: normal;
        }

        .font-soehne {
            font-family: 'Soehne', sans-serif;
        }

        .headline-gradient {
            background: linear-gradient(78deg, #1398F8 -21.21%, #FF5024 90.36%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#1a1a1a',
                        'brand-orange': '#e86c3a',
                        'brand-blue': '#5b8a9a',
                        'brand-mauve': '#a87f8f',
                    }
                }
            }
        }
    </script>
</head>
<body style="background: #111;" class="min-h-screen flex items-center justify-center">
    <main class="max-w-2xl mx-auto px-8 py-24 text-center">
        <!-- Success Icon -->
        <div class="mb-8">
            <div class="w-20 h-20 mx-auto rounded-full flex items-center justify-center" style="background: #FF5125;">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
        </div>

        <!-- Heading -->
        <h1 class="font-soehne text-4xl md:text-5xl headline-gradient mb-6">
            You're In!
        </h1>

        <!-- Confirmation Text -->
        <p class="text-gray-300 text-lg md:text-xl mb-4">
            Thanks for joining the 10K Challenge!
        </p>
        <p class="text-gray-500 mb-10">
            Click below to join the Discord and follow along.
        </p>

        <!-- Discord Button -->
        <a
            href="https://discord.gg/YOUR_INVITE_CODE"
            target="_blank"
            rel="noopener noreferrer"
            class="inline-flex items-center gap-3 text-white font-medium text-lg px-8 py-4 hover:opacity-90 transition-opacity mb-6"
            style="background: #5865F2; border-radius: 19px;"
        >
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
            Join Discord
        </a>

        <div class="block mb-10">
            <p class="text-gray-600 text-sm">
                (Replace YOUR_INVITE_CODE in the HTML with your actual Discord invite link)
            </p>
        </div>

        <!-- Back Button -->
        <a
            href="/challenge"
            class="inline-block text-white font-medium text-lg px-8 py-4 hover:opacity-90 transition-opacity"
            style="background: #FF5125; border-radius: 19px;"
        >
            Back to Challenge
        </a>
    </main>
</body>
</html>
