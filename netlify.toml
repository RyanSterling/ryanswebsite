[build]
  publish = "dist"
  command = "npm run build"

# Static HTML pages (must come before SPA catch-all)
[[redirects]]
  from = "/claude-skill"
  to = "/claude-skill.html"
  status = 200

# SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Proper MIME types for JS modules
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
